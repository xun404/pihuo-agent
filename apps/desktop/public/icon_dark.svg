<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 100 100"
  width="100%"
  height="100%"
  class="theme-dark"
  role="img"
  aria-labelledby="hiveTitle hiveDesc"
>
  <title id="hiveTitle">Swarm Honeycomb Icon</title>
  <desc id="hiveDesc">
    A clean honeycomb background with a central honey-colored hexagon core and subtle animation.
  </desc>

  <defs>
    <!-- =========================
         背景渐变
    ========================== -->
    <radialGradient id="bgLight" cx="50%" cy="48%" r="72%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F5F8"/>
    </radialGradient>

    <radialGradient id="bgDark" cx="50%" cy="48%" r="72%">
      <stop offset="0%" stop-color="#171A22"/>
      <stop offset="100%" stop-color="#090A0F"/>
    </radialGradient>

    <!-- =========================
         中央核心六边形渐变
    ========================== -->
    <linearGradient id="coreGoldLight" x1="20%" y1="15%" x2="80%" y2="85%">
      <stop offset="0%" stop-color="#C89A2B" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#C89A2B" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#C89A2B" stop-opacity="0.14"/>
    </linearGradient>

    <linearGradient id="coreGoldDark" x1="20%" y1="15%" x2="80%" y2="85%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.20"/>
      <stop offset="55%" stop-color="#D4AF37" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.16"/>
    </linearGradient>

    <!-- =========================
         中央柔光
    ========================== -->
    <radialGradient id="coreGlowLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C89A2B" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#C89A2B" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#C89A2B" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="coreGlowDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#D4AF37" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>

    <!-- =========================
         蜂巢渐隐蒙版
    ========================== -->
    <radialGradient id="hiveFade" cx="50%" cy="50%" r="56%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="38%" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="66%" stop-color="#FFFFFF" stop-opacity="0.52"/>
      <stop offset="86%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <mask id="hiveFadeMask" maskUnits="userSpaceOnUse">
      <rect x="1" y="1" width="98" height="98" rx="21" fill="url(#hiveFade)"/>
    </mask>

    <!-- 圆角裁剪 -->
    <clipPath id="cardClip">
      <rect x="1" y="1" width="98" height="98" rx="21"/>
    </clipPath>

    <!-- =========================
         统一背景六边形
         所有单元尺寸一致，避免重叠
    ========================== -->
    <path
      id="hexCell"
      d="
        M0,-5
        L4.33,-2.5
        L4.33,2.5
        L0,5
        L-4.33,2.5
        L-4.33,-2.5
        Z
      "
      fill="none"
      stroke="var(--hive-line)"
      stroke-width="0.6"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
  </defs>

  <style>
    .theme-white {
      --background: url(#bgLight);
      --hive-line: #667085;
      --border: #667085;
      --core-fill: url(#coreGoldLight);
      --core-stroke: #C89A2B;
      --core-glow: url(#coreGlowLight);

      --hive-opacity: 0.46;
      --border-opacity: 0.16;
      --core-fill-opacity: 1;
      --core-stroke-opacity: 0.86;
      --core-inner-opacity: 0.45;
    }

    .theme-dark {
      --background: url(#bgDark);
      --hive-line: #CBD5E1;
      --border: #CBD5E1;
      --core-fill: url(#coreGoldDark);
      --core-stroke: #D4AF37;
      --core-glow: url(#coreGlowDark);

      --hive-opacity: 0.34;
      --border-opacity: 0.12;
      --core-fill-opacity: 1;
      --core-stroke-opacity: 0.92;
      --core-inner-opacity: 0.50;
    }

    /* =========================
       动画
    ========================== */
    .hive-field {
      transform-origin: 50px 50px;
      animation: hiveBreath 6s ease-in-out infinite;
    }

    .core-glow {
      transform-origin: 50px 50px;
      animation: glowPulse 4.2s ease-in-out infinite;
    }

    .core-outer {
      transform-origin: 50px 50px;
      animation: corePulse 3.8s ease-in-out infinite;
    }

    .core-inner {
      transform-origin: 50px 50px;
      animation: corePulse 3.8s 0.8s ease-in-out infinite;
    }

    @keyframes hiveBreath {
      0%, 100% {
        opacity: var(--hive-opacity);
      }
      50% {
        opacity: calc(var(--hive-opacity) + 0.08);
      }
    }

    @keyframes glowPulse {
      0%, 100% {
        transform: scale(0.96);
        opacity: 0.72;
      }
      50% {
        transform: scale(1.08);
        opacity: 1;
      }
    }

    @keyframes corePulse {
      0%, 100% {
        transform: scale(0.985);
        opacity: 0.94;
      }
      50% {
        transform: scale(1.03);
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .hive-field,
      .core-glow,
      .core-outer,
      .core-inner {
        animation: none !important;
      }
    }
  </style>

  <!-- =========================
       背景卡片
  ========================== -->
  <rect
    x="1"
    y="1"
    width="98"
    height="98"
    rx="21"
    fill="var(--background)"
    stroke="var(--border)"
    stroke-opacity="var(--border-opacity)"
    stroke-width="1"
  />

  <!-- =========================
       均匀蜂巢背景
  ========================== -->
  <g clip-path="url(#cardClip)">
    <g class="hive-field" mask="url(#hiveFadeMask)">
      <!-- row 1 -->
      <use href="#hexCell" transform="translate(8.6 9.8)"/>
      <use href="#hexCell" transform="translate(19.0 9.8)"/>
      <use href="#hexCell" transform="translate(29.4 9.8)"/>
      <use href="#hexCell" transform="translate(39.8 9.8)"/>
      <use href="#hexCell" transform="translate(50.2 9.8)"/>
      <use href="#hexCell" transform="translate(60.6 9.8)"/>
      <use href="#hexCell" transform="translate(71.0 9.8)"/>
      <use href="#hexCell" transform="translate(81.4 9.8)"/>
      <use href="#hexCell" transform="translate(91.8 9.8)"/>

      <!-- row 2 -->
      <use href="#hexCell" transform="translate(13.8 18.4)"/>
      <use href="#hexCell" transform="translate(24.2 18.4)"/>
      <use href="#hexCell" transform="translate(34.6 18.4)"/>
      <use href="#hexCell" transform="translate(45.0 18.4)"/>
      <use href="#hexCell" transform="translate(55.4 18.4)"/>
      <use href="#hexCell" transform="translate(65.8 18.4)"/>
      <use href="#hexCell" transform="translate(76.2 18.4)"/>
      <use href="#hexCell" transform="translate(86.6 18.4)"/>

      <!-- row 3 -->
      <use href="#hexCell" transform="translate(8.6 27.0)"/>
      <use href="#hexCell" transform="translate(19.0 27.0)"/>
      <use href="#hexCell" transform="translate(29.4 27.0)"/>
      <use href="#hexCell" transform="translate(39.8 27.0)"/>
      <use href="#hexCell" transform="translate(50.2 27.0)"/>
      <use href="#hexCell" transform="translate(60.6 27.0)"/>
      <use href="#hexCell" transform="translate(71.0 27.0)"/>
      <use href="#hexCell" transform="translate(81.4 27.0)"/>
      <use href="#hexCell" transform="translate(91.8 27.0)"/>

      <!-- row 4 -->
      <use href="#hexCell" transform="translate(13.8 35.6)"/>
      <use href="#hexCell" transform="translate(24.2 35.6)"/>
      <use href="#hexCell" transform="translate(34.6 35.6)"/>
      <use href="#hexCell" transform="translate(45.0 35.6)"/>
      <use href="#hexCell" transform="translate(55.4 35.6)"/>
      <use href="#hexCell" transform="translate(65.8 35.6)"/>
      <use href="#hexCell" transform="translate(76.2 35.6)"/>
      <use href="#hexCell" transform="translate(86.6 35.6)"/>

      <!-- row 5 -->
      <use href="#hexCell" transform="translate(8.6 44.2)"/>
      <use href="#hexCell" transform="translate(19.0 44.2)"/>
      <use href="#hexCell" transform="translate(29.4 44.2)"/>
      <use href="#hexCell" transform="translate(39.8 44.2)"/>
      <use href="#hexCell" transform="translate(50.2 44.2)"/>
      <use href="#hexCell" transform="translate(60.6 44.2)"/>
      <use href="#hexCell" transform="translate(71.0 44.2)"/>
      <use href="#hexCell" transform="translate(81.4 44.2)"/>
      <use href="#hexCell" transform="translate(91.8 44.2)"/>

      <!-- row 6 -->
      <use href="#hexCell" transform="translate(13.8 52.8)"/>
      <use href="#hexCell" transform="translate(24.2 52.8)"/>
      <use href="#hexCell" transform="translate(34.6 52.8)"/>
      <use href="#hexCell" transform="translate(45.0 52.8)"/>
      <use href="#hexCell" transform="translate(55.4 52.8)"/>
      <use href="#hexCell" transform="translate(65.8 52.8)"/>
      <use href="#hexCell" transform="translate(76.2 52.8)"/>
      <use href="#hexCell" transform="translate(86.6 52.8)"/>

      <!-- row 7 -->
      <use href="#hexCell" transform="translate(8.6 61.4)"/>
      <use href="#hexCell" transform="translate(19.0 61.4)"/>
      <use href="#hexCell" transform="translate(29.4 61.4)"/>
      <use href="#hexCell" transform="translate(39.8 61.4)"/>
      <use href="#hexCell" transform="translate(50.2 61.4)"/>
      <use href="#hexCell" transform="translate(60.6 61.4)"/>
      <use href="#hexCell" transform="translate(71.0 61.4)"/>
      <use href="#hexCell" transform="translate(81.4 61.4)"/>
      <use href="#hexCell" transform="translate(91.8 61.4)"/>

      <!-- row 8 -->
      <use href="#hexCell" transform="translate(13.8 70.0)"/>
      <use href="#hexCell" transform="translate(24.2 70.0)"/>
      <use href="#hexCell" transform="translate(34.6 70.0)"/>
      <use href="#hexCell" transform="translate(45.0 70.0)"/>
      <use href="#hexCell" transform="translate(55.4 70.0)"/>
      <use href="#hexCell" transform="translate(65.8 70.0)"/>
      <use href="#hexCell" transform="translate(76.2 70.0)"/>
      <use href="#hexCell" transform="translate(86.6 70.0)"/>

      <!-- row 9 -->
      <use href="#hexCell" transform="translate(8.6 78.6)"/>
      <use href="#hexCell" transform="translate(19.0 78.6)"/>
      <use href="#hexCell" transform="translate(29.4 78.6)"/>
      <use href="#hexCell" transform="translate(39.8 78.6)"/>
      <use href="#hexCell" transform="translate(50.2 78.6)"/>
      <use href="#hexCell" transform="translate(60.6 78.6)"/>
      <use href="#hexCell" transform="translate(71.0 78.6)"/>
      <use href="#hexCell" transform="translate(81.4 78.6)"/>
      <use href="#hexCell" transform="translate(91.8 78.6)"/>

      <!-- row 10 -->
      <use href="#hexCell" transform="translate(13.8 87.2)"/>
      <use href="#hexCell" transform="translate(24.2 87.2)"/>
      <use href="#hexCell" transform="translate(34.6 87.2)"/>
      <use href="#hexCell" transform="translate(45.0 87.2)"/>
      <use href="#hexCell" transform="translate(55.4 87.2)"/>
      <use href="#hexCell" transform="translate(65.8 87.2)"/>
      <use href="#hexCell" transform="translate(76.2 87.2)"/>
      <use href="#hexCell" transform="translate(86.6 87.2)"/>
    </g>
  </g>

  <!-- =========================
       中央柔光
  ========================== -->
  <circle
    class="core-glow"
    cx="50"
    cy="50"
    r="18"
    fill="var(--core-glow)"
    pointer-events="none"
  />

  <!-- =========================
       中央蜂蜜色核心六边形
  ========================== -->
  <path
    class="core-outer"
    d="
      M50,32
      L65.588,41
      L65.588,59
      L50,68
      L34.412,59
      L34.412,41
      Z
    "
    fill="var(--core-fill)"
    fill-opacity="var(--core-fill-opacity)"
    stroke="var(--core-stroke)"
    stroke-opacity="var(--core-stroke-opacity)"
    stroke-width="1.1"
    stroke-linejoin="round"
  />

  <path
    class="core-inner"
    d="
      M50,38
      L60.392,44
      L60.392,56
      L50,62
      L39.608,56
      L39.608,44
      Z
    "
    fill="none"
    stroke="var(--core-stroke)"
    stroke-opacity="var(--core-inner-opacity)"
    stroke-width="0.8"
    stroke-linejoin="round"
  />
</svg>