<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'; connect-src 'self' http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:*; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <!--
      `frame-ancestors` is intentionally omitted from the <meta> CSP: per the
      CSP spec it is ignored when delivered via <meta> and only emits a console
      error. Clickjacking protection via frame-ancestors must come from a
      response header, which is not applicable here (Electron loads a local /
      dev-server origin, never embedded in a third-party frame).
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="./icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="./icon.png" />
    <title>SwarmDesk</title>
    <script type="module" src="/src/theme-bootstrap.ts"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
