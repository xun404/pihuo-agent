appId: app.swarmdesk.agent
productName: SwarmDesk
artifactName: SwarmDesk-Agent-${version}-${os}-${arch}.${ext}
asar: true
npmRebuild: false
directories:
  output: release
  buildResources: build
# Source mark: build/icon.png (1024) + build/icon.icns (mac). electron-builder
# derives platform artifacts; keep both in sync when regenerating the brand mark.
icon: build/icon.png
files:
  - package.json
  - apps/desktop/dist/**/*
  - apps/desktop/dist-electron/**/*
extraMetadata:
  main: apps/desktop/dist-electron/main.js
  author:
    name: xun404
    email: xun404@users.noreply.github.com
extraResources:
  - from: apps/desktop/dist-runtime
    to: runtime
  # electron-builder filters a source-root node_modules directory. Copy it
  # through a dedicated matcher so the packaged API can resolve native deps.
  - from: apps/desktop/dist-runtime/node_modules
    to: runtime/node_modules
mac:
  identity: null
  # Prefer multi-resolution ICNS when present (build/icon.icns from brand mark).
  icon: build/icon.icns
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
win:
  target:
    - target: nsis
      arch:
        - x64
linux:
  category: Development
  executableName: swarmdesk-agent
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
publish:
  provider: github
  owner: xun404
  repo: swarmdesk-agent
