name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test, typecheck, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      # libsql optional native bindings must resolve for the runner platform
      # (lockfile must list each @libsql/* package — not only the host that generated it).
      - name: Verify libsql native binding
        run: node -e "require('libsql'); console.log('libsql ok', process.platform, process.arch)"
      # electron@43 has no postinstall binary fetch — cache + ensure before vite build.
      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Ensure Electron binary
        run: node apps/desktop/scripts/ensure-electron.mjs
        timeout-minutes: 15
      - run: npm test
      - run: npm run verify:workflows
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  package:
    name: Package ${{ matrix.artifact }}
    needs: quality
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: desktop-macos-arm64
            builderArgs: --mac --arm64
          - os: windows-2025
            artifact: desktop-windows-x64
            builderArgs: --win --x64
          - os: ubuntu-24.04
            artifact: desktop-linux-x64
            builderArgs: --linux --x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb libopenjp2-tools
      - run: npm ci
      - name: Verify libsql native binding
        run: node -e "require('libsql'); console.log('libsql ok', process.platform, process.arch)"
      # Isolate hung Electron downloads from the longer vite/electron-builder steps.
      - name: Ensure Electron binary
        run: node apps/desktop/scripts/ensure-electron.mjs
        timeout-minutes: 15
      - run: npm run build
        timeout-minutes: 20
      - run: npm run build:runtime
        timeout-minutes: 10
      - run: npm run verify:runtime
        # Must exit promptly; Windows ConPTY handle leaks previously hung until job timeout.
        timeout-minutes: 5
      - run: npx electron-builder --dir ${{ matrix.builderArgs }} --publish never
        timeout-minutes: 20
      - run: npm run smoke:packaged
        timeout-minutes: 10
      - run: npx electron-builder ${{ matrix.builderArgs }} --publish never
        timeout-minutes: 25
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/SwarmDesk-Agent-*
            release/latest*.yml
          if-no-files-found: error
          retention-days: 7
