name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test, typecheck, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      # libsql optional native bindings must resolve for the runner platform
      # (lockfile must list each @libsql/* package — not only the host that generated it).
      - name: Verify libsql native binding
        run: node -e "require('libsql'); console.log('libsql ok', process.platform, process.arch)"
      # electron@43 has no postinstall binary fetch — cache + ensure before vite build.
      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Ensure Electron binary
        run: node apps/desktop/scripts/ensure-electron.mjs
        timeout-minutes: 15
      - run: npm test
      - run: npm run verify:workflows
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:source-size
      - run: npm run format:check
      - run: npm run build
