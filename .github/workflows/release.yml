name: Desktop Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to build or recover
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  quality:
    name: Verify release source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run verify:release-tag
      - run: npm test
      - run: npm run verify:workflows
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:source-size
      - run: npm run format:check
      - run: npm run build

  package:
    name: Package ${{ matrix.artifact }}
    needs: quality
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: desktop-macos-arm64
            builderArgs: --mac --arm64
          # Temporarily disabled with CI (2026-07-20): Windows packaged-smoke hang on GHA.
          # - os: windows-2025
          #   artifact: desktop-windows-x64
          #   builderArgs: --win --x64
          - os: ubuntu-24.04
            artifact: desktop-linux-x64
            builderArgs: --linux --x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb libopenjp2-tools
      - run: npm ci
      - run: npm run verify:release-tag
      # Pull latest @mastra/core provider models into bundled catalog before package.
      - run: npm run sync:model-registry
      - run: npm run build
      - run: npm run build:runtime
      - run: npm run verify:runtime
      - run: npx electron-builder --dir ${{ matrix.builderArgs }} --publish never
      - run: npm run smoke:packaged
      - run: npx electron-builder ${{ matrix.builderArgs }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/SwarmDesk-Agent-*
            release/latest*.yml
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish complete GitHub Release
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - run: node scripts/verify-release-assets.mjs release-assets
      - name: Verify bilingual release notes
        run: node scripts/verify-release-notes.mjs "docs/releases/${RELEASE_TAG}.md" "$RELEASE_TAG"
      - name: Generate SHA-256 checksums
        run: |
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' \
            | sort \
            | while IFS= read -r file; do sha256sum "$file"; done \
            > SHA256SUMS.txt
      - name: Create or recover release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES_FILE="docs/releases/${RELEASE_TAG}.md"
          TITLE="SwarmDesk ${RELEASE_TAG}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --title "$TITLE" --notes-file "$NOTES_FILE"
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag \
              --notes-file "$NOTES_FILE" \
              --title "$TITLE"
          fi
