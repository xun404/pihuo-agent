<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 100 100"
  width="100%"
  height="100%"
  class="theme-dark "
  role="img"
  aria-labelledby="swarmTitle swarmDescription"
>
  <title id="swarmTitle">Swarm Agent Icon</title>
  <desc id="swarmDescription">
    A queen bee coordinates a multi-agent system over a fading honeycomb network.
  </desc>

  <defs>
    <!-- =========================
         背景渐变
    ========================== -->

    <radialGradient id="lightBg" cx="48%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="68%" stop-color="#F5F7FA"/>
      <stop offset="100%" stop-color="#E7EBF1"/>
    </radialGradient>

    <radialGradient id="darkBg" cx="50%" cy="48%" r="70%">
      <stop offset="0%" stop-color="#1D2028"/>
      <stop offset="65%" stop-color="#11131A"/>
      <stop offset="100%" stop-color="#08090D"/>
    </radialGradient>

    <!-- =========================
         金属渐变
    ========================== -->

    <linearGradient id="champagne" x1="15%" y1="5%" x2="90%" y2="95%">
      <stop offset="0%" stop-color="#FFF3D8"/>
      <stop offset="35%" stop-color="#E6C873"/>
      <stop offset="65%" stop-color="#C69A2D"/>
      <stop offset="100%" stop-color="#806019"/>
    </linearGradient>

    <linearGradient id="queenBody" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFF7E7"/>
      <stop offset="25%" stop-color="#EACF87"/>
      <stop offset="62%" stop-color="#C89A2B"/>
      <stop offset="100%" stop-color="#795A17"/>
    </linearGradient>

    <linearGradient id="wingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#DDE5EF" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.28"/>
    </linearGradient>

    <!-- =========================
         蜂巢图案
    ========================== -->

    <pattern
      id="honeycombPattern"
      x="0"
      y="0"
      width="12"
      height="20.784"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="
          M6,0
          L12,3.464
          L12,10.392
          L6,13.856
          L0,10.392
          L0,3.464
          Z

          M6,13.856
          L12,17.320
          L12,20.784

          M0,20.784
          L0,17.320
          L6,13.856
        "
        fill="none"
        stroke="var(--honeycomb-line)"
        stroke-width="0.58"
        stroke-linejoin="round"
      />
    </pattern>

    <!-- 中心清晰，向外逐步透明 -->
    <radialGradient id="honeycombFade" cx="50%" cy="50%" r="54%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="22%" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="44%" stop-color="#FFFFFF" stop-opacity="0.76"/>
      <stop offset="64%" stop-color="#FFFFFF" stop-opacity="0.46"/>
      <stop offset="82%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <mask id="honeycombMask" maskUnits="userSpaceOnUse">
      <rect
        x="2"
        y="2"
        width="96"
        height="96"
        rx="20"
        fill="url(#honeycombFade)"
      />
    </mask>

    <!-- 中央蜂巢轻微金色聚焦 -->
    <radialGradient id="honeycombCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D5AD43" stop-opacity="0.2"/>
      <stop offset="45%" stop-color="#D5AD43" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#D5AD43" stop-opacity="0"/>
    </radialGradient>

    <!-- =========================
         滤镜
    ========================== -->

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="goldGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>

      <feColorMatrix
        in="blur"
        type="matrix"
        values="
          1 0 0 0 0.75
          0 1 0 0 0.52
          0 0 1 0 0.12
          0 0 0 0.75 0
        "
        result="goldBlur"
      />

      <feMerge>
        <feMergeNode in="goldBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow
        dx="0"
        dy="2"
        stdDeviation="3"
        flood-color="#0F172A"
        flood-opacity="0.16"
      />
    </filter>

    <!-- 六边形基础路径 -->
    <path
      id="hexagon"
      d="M0,-4.6 L4,-2.3 L4,2.3 L0,4.6 L-4,2.3 L-4,-2.3 Z"
    />
  </defs>

  <style>
    /* =========================
       白色主题
    ========================== */

    .theme-white {
      --background-fill: url(#lightBg);
      --border-color: #D8DEE8;

      --secondary-line: #64748B;
      --soft-line: #94A3B8;

      --node-core: #FFFFFF;

      --honeycomb-line: #59677A;
      --honeycomb-opacity: 0.58;

      --queen-outline: #2D3748;
      --queen-dark: #263445;
      --queen-highlight: #FFFFFF;

      --bee-wing: url(#wingGradient);

      --inner-highlight: #FFFFFF;
      --inner-highlight-opacity: 0.72;
    }

    /* =========================
       黑色主题
    ========================== */

    .theme-dark {
      --background-fill: url(#darkBg);
      --border-color: #252A35;

      --secondary-line: #CBD5E1;
      --soft-line: #94A3B8;

      --node-core: #111827;

      --honeycomb-line: #C7D0DD;
      --honeycomb-opacity: 0.46;

      --queen-outline: #F8FAFC;
      --queen-dark: #111827;
      --queen-highlight: #FFFFFF;

      --bee-wing: url(#wingGradient);

      --inner-highlight: #FFFFFF;
      --inner-highlight-opacity: 0.15;
    }

    /* =========================
       动画
    ========================== */

    .core-system,
    .queen-symbol,
    .queen-body,
    .queen-crown,
    .queen-wings {
      transform-box: fill-box;
      transform-origin: center;
    }

    .queen-symbol {
      animation: queenPulse 4s ease-in-out infinite;
    }

    .queen-wings {
      animation: wingBreath 2.8s ease-in-out infinite;
    }

    .pulse-ring {
      transform-origin: 50px 50px;
      animation: ripple 4s ease-out infinite;
    }

    .pulse-ring-delayed {
      transform-origin: 50px 50px;
      animation: ripple 4s 2s ease-out infinite;
    }

    @keyframes queenPulse {
      0%,
      100% {
        transform: scale(0.96);
        opacity: 0.94;
      }

      50% {
        transform: scale(1.04);
        opacity: 1;
      }
    }

    @keyframes wingBreath {
      0%,
      100% {
        transform: scaleX(0.97) scaleY(1);
      }

      50% {
        transform: scaleX(1.04) scaleY(0.98);
      }
    }

    @keyframes ripple {
      0% {
        transform: scale(0.78);
        opacity: 0.56;
      }

      100% {
        transform: scale(1.55);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .queen-symbol,
      .queen-wings,
      .pulse-ring,
      .pulse-ring-delayed {
        animation: none !important;
      }
    }
  </style>

  <!-- =========================
       背景
  ========================== -->

  <rect
    x="1"
    y="1"
    width="98"
    height="98"
    rx="21"
    fill="var(--background-fill)"
    stroke="var(--border-color)"
    stroke-width="1"
    filter="url(#cardShadow)"
  />

  <!-- =========================
       渐隐蜂巢背景
  ========================== -->

  <g mask="url(#honeycombMask)">
    <rect
      x="-8"
      y="-8"
      width="116"
      height="116"
      fill="url(#honeycombPattern)"
      opacity="var(--honeycomb-opacity)"
    />
  </g>

  <!-- 中央金色蜂巢聚焦 -->
  <circle
    cx="50"
    cy="50"
    r="35"
    fill="url(#honeycombCoreGlow)"
    pointer-events="none"
  />

  <!-- 内部高光 -->
  <path
    d="M22,7 H78 C87,7 93,13 93,22"
    fill="none"
    stroke="var(--inner-highlight)"
    stroke-width="0.75"
    stroke-linecap="round"
    opacity="var(--inner-highlight-opacity)"
  />

  <!-- =========================
       静态协调网络
  ========================== -->

  <g
    fill="none"
    stroke="var(--secondary-line)"
    stroke-width="0.42"
    stroke-dasharray="1 2.5"
    opacity="0.34"
  >
    <path d="M50,20 C38,28 32,37 28,50"/>
    <path d="M50,20 C62,28 68,37 72,50"/>
    <path d="M28,50 C34,64 40,72 50,80"/>
    <path d="M72,50 C66,64 60,72 50,80"/>
  </g>

  <!-- =========================
       中央能量涟漪
  ========================== -->

  <circle
    class="pulse-ring"
    cx="50"
    cy="50"
    r="17"
    fill="none"
    stroke="url(#champagne)"
    stroke-width="0.65"
  />

  <circle
    class="pulse-ring-delayed"
    cx="50"
    cy="50"
    r="17"
    fill="none"
    stroke="url(#champagne)"
    stroke-width="0.45"
  />

  <!-- =========================
       蜂王六边形核心
  ========================== -->

  <g class="core-system">
    <use
      href="#hexagon"
      transform="translate(50 50) scale(5.15)"
      fill="var(--node-core)"
      fill-opacity="0.52"
      stroke="url(#champagne)"
      stroke-width="0.22"
      filter="url(#goldGlow)"
    />

    <use
      href="#hexagon"
      transform="translate(50 50) scale(4.15)"
      fill="none"
      stroke="url(#champagne)"
      stroke-width="0.18"
      opacity="0.7"
    />
  </g>

  <!-- =========================
       中央蜂王
  ========================== -->

  <g class="queen-symbol" filter="url(#goldGlow)">
    <!-- 翅膀 -->
    <g class="queen-wings">
      <path
        d="
          M46.2,45.6
          C42.2,39.7 34.6,37.3 31.5,41.5
          C29.1,44.7 33.5,49.2 43.4,50.7
          C37.2,51.8 32.8,55 34.8,58.6
          C37,62.3 43.3,59.7 47.1,54.6
          Z
        "
        fill="var(--bee-wing)"
        stroke="var(--queen-outline)"
        stroke-width="0.72"
        stroke-linejoin="round"
      />

      <path
        d="
          M53.8,45.6
          C57.8,39.7 65.4,37.3 68.5,41.5
          C70.9,44.7 66.5,49.2 56.6,50.7
          C62.8,51.8 67.2,55 65.2,58.6
          C63,62.3 56.7,59.7 52.9,54.6
          Z
        "
        fill="var(--bee-wing)"
        stroke="var(--queen-outline)"
        stroke-width="0.72"
        stroke-linejoin="round"
      />

      <path
        d="M44.8,47.5 C40.5,44 36.4,42.8 33.4,43"
        fill="none"
        stroke="var(--soft-line)"
        stroke-width="0.42"
        stroke-linecap="round"
        opacity="0.75"
      />

      <path
        d="M55.2,47.5 C59.5,44 63.6,42.8 66.6,43"
        fill="none"
        stroke="var(--soft-line)"
        stroke-width="0.42"
        stroke-linecap="round"
        opacity="0.75"
      />

      <path
        d="M44.2,52.8 C40.7,54.5 38.1,56.4 36.7,58"
        fill="none"
        stroke="var(--soft-line)"
        stroke-width="0.42"
        stroke-linecap="round"
        opacity="0.68"
      />

      <path
        d="M55.8,52.8 C59.3,54.5 61.9,56.4 63.3,58"
        fill="none"
        stroke="var(--soft-line)"
        stroke-width="0.42"
        stroke-linecap="round"
        opacity="0.68"
      />
    </g>

    <!-- 身体 -->
    <g class="queen-body">
      <!-- 头部 -->
      <path
        d="
          M45.7,44.4
          C45.7,40.7 47.3,38.5 50,38.5
          C52.7,38.5 54.3,40.7 54.3,44.4
          C54.3,47.2 52.5,49 50,49
          C47.5,49 45.7,47.2 45.7,44.4
          Z
        "
        fill="var(--queen-dark)"
        stroke="var(--queen-outline)"
        stroke-width="0.72"
      />

      <!-- 眼睛 -->
      <ellipse
        cx="48.15"
        cy="43.6"
        rx="0.72"
        ry="1.12"
        fill="var(--queen-highlight)"
      />

      <ellipse
        cx="51.85"
        cy="43.6"
        rx="0.72"
        ry="1.12"
        fill="var(--queen-highlight)"
      />

      <!-- 触角 -->
      <path
        d="M47.7,39.5 C46.6,36.8 44.3,36.7 43.9,34.7"
        fill="none"
        stroke="var(--queen-outline)"
        stroke-width="0.78"
        stroke-linecap="round"
      />

      <path
        d="M52.3,39.5 C53.4,36.8 55.7,36.7 56.1,34.7"
        fill="none"
        stroke="var(--queen-outline)"
        stroke-width="0.78"
        stroke-linecap="round"
      />

      <circle
        cx="43.8"
        cy="34.3"
        r="0.78"
        fill="url(#champagne)"
      />

      <circle
        cx="56.2"
        cy="34.3"
        r="0.78"
        fill="url(#champagne)"
      />

      <!-- 胸部 -->
      <path
        d="
          M44.8,49
          C45.8,46.8 48,46.1 50,46.1
          C52,46.1 54.2,46.8 55.2,49
          L54,54
          C53.5,56.2 51.8,57.4 50,57.4
          C48.2,57.4 46.5,56.2 46,54
          Z
        "
        fill="url(#queenBody)"
        stroke="var(--queen-outline)"
        stroke-width="0.82"
      />

      <!-- 腹部 -->
      <path
        d="
          M46.1,54
          C45.8,58.2 46.5,64.8 50,69.5
          C53.5,64.8 54.2,58.2 53.9,54
          C52.8,55.4 51.5,56 50,56
          C48.5,56 47.2,55.4 46.1,54
          Z
        "
        fill="url(#queenBody)"
        stroke="var(--queen-outline)"
        stroke-width="0.82"
        stroke-linejoin="round"
      />

      <!-- 条纹 -->
      <path
        d="M46.4,57.2 C48.7,58.1 51.3,58.1 53.6,57.2"
        fill="none"
        stroke="var(--queen-dark)"
        stroke-width="1.22"
        stroke-linecap="round"
      />

      <path
        d="M46.8,61 C48.9,61.8 51.1,61.8 53.2,61"
        fill="none"
        stroke="var(--queen-dark)"
        stroke-width="1.22"
        stroke-linecap="round"
      />

      <path
        d="M47.7,64.7 C49.2,65.25 50.8,65.25 52.3,64.7"
        fill="none"
        stroke="var(--queen-dark)"
        stroke-width="1.05"
        stroke-linecap="round"
      />

      <!-- 中央高光 -->
      <polygon
        points="50,48.7 47.9,51 50,53.3 52.1,51"
        fill="#FFFFFF"
        opacity="0.92"
      />
    </g>

    <!-- 皇冠 -->
    <g class="queen-crown">
      <path
        d="
          M44.4,37.6
          L43.1,32.3
          L46.5,34.4
          L50,30.1
          L53.5,34.4
          L56.9,32.3
          L55.6,37.6
          Z
        "
        fill="url(#champagne)"
        stroke="var(--queen-outline)"
        stroke-width="0.72"
        stroke-linejoin="round"
      />

      <path
        d="M44.7,37.6 H55.3"
        fill="none"
        stroke="var(--queen-outline)"
        stroke-width="0.8"
        stroke-linecap="round"
      />

      <circle cx="43.1" cy="32.25" r="0.72" fill="#FFFFFF"/>
      <circle cx="50" cy="30.05" r="0.82" fill="#FFFFFF"/>
      <circle cx="56.9" cy="32.25" r="0.72" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- =========================
       四方向协调节点
  ========================== -->

  <g fill="url(#champagne)" filter="url(#softGlow)">
    <circle cx="50" cy="24" r="0.95"/>
    <circle cx="76" cy="50" r="0.95"/>
    <circle cx="50" cy="76" r="0.95"/>
    <circle cx="24" cy="50" r="0.95"/>
  </g>

  <!-- 中心协调连接 -->
  <g
    fill="none"
    stroke="url(#champagne)"
    stroke-width="0.42"
    stroke-dasharray="1 2"
    opacity="0.48"
  >
    <path d="M50,38 L50,24"/>
    <path d="M62,50 L76,50"/>
    <path d="M50,62 L50,76"/>
    <path d="M38,50 L24,50"/>
  </g>
</svg>